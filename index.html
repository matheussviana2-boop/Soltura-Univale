<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Soltura de Veículos · Univale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F5F8; --card:#FFFFFF; --ln:#E2E7EE; --ln2:#D5DCE4;
    --tx:#1B2A3D; --tx2:#3A4A5E; --mut:#5B6B7E;
    --navy:#1B2F5C; --teal:#00A19B;
    --green:#1E8C4E; --green-d:#16653A; --green-bg:#E6F4EC;
    --red:#D9480F; --red-d:#A8380B; --red-bg:#FDEDE4;
    --amb:#E8A317; --amb-d:#7A5200; --amb-bg:#FDF4DD;
    --gray:#7C8A9C; --gray-d:#46566A; --gray-bg:#EEF1F5;
    --blue:#2F6FB3; --blue-d:#1D4E7A; --blue-bg:#E4EEF8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--tx);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
  button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
  button{cursor:pointer}
  .grow{flex:1}

  /* topo */
  header{display:flex;align-items:center;gap:20px;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--ln)}
  .logo{display:flex;flex-direction:column;line-height:1}
  .logo b{font-size:30px;font-weight:800;letter-spacing:-.04em;color:var(--navy)}
  .logo small{font-size:9px;font-weight:700;letter-spacing:.32em;color:var(--teal);margin-top:3px}
  .titulo{flex:1;text-align:center;font-size:20px;font-weight:800;letter-spacing:.02em}
  .hinfo{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--mut);white-space:nowrap}
  .hinfo .sep{color:#C3CCD6}
  .hinfo .hora{font-weight:800;color:var(--tx);font-size:16px}
  .net{display:inline-flex}
  .net.off svg{stroke:var(--red)}
  .who{height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--ln2);background:var(--card);color:var(--tx2);font-size:13px;font-weight:600}

  /* busca + filtros */
  .tool{display:flex;gap:12px;padding:16px 24px 12px}
  .busca{flex:1;display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;background:var(--card);border:1px solid var(--ln2);border-radius:12px;color:#6B7A8C}
  .busca{min-width:0} .busca input{flex:1;min-width:0;width:100%;border:0;outline:none;background:transparent;color:var(--tx)}
  .bfil{display:flex;align-items:center;gap:8px;height:48px;padding:0 20px;background:var(--card);border:1px solid var(--ln2);border-radius:12px;font-weight:600;color:var(--tx)}
  .bfil.on{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
  .filtros{display:none;flex-wrap:wrap;gap:16px;margin:0 24px 12px;padding:14px 16px;background:var(--card);border:1px solid var(--ln2);border-radius:12px}
  .filtros.on{display:flex}
  .filtros label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--tx2)}
  .filtros select,.filtros input{height:44px;min-width:220px;padding:0 12px;border:1px solid var(--ln2);border-radius:10px;background:var(--card)}

  /* abas */
  .tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:0 24px 10px}
  .tab{height:46px;border-radius:10px;border:1px solid var(--ln2);background:var(--card);color:var(--tx2);font-size:15px;font-weight:700}
  .tab.on{background:var(--green);border-color:var(--green);color:#FFFFFF}
  .resumo{padding:0 24px 10px;font-size:14px;color:var(--mut)} .resumo b{color:var(--tx)} .resumo .c{color:var(--red-d)}
  .banner{margin:0 24px 12px;padding:10px 14px;border-radius:10px;background:var(--amb-bg);border:1px solid #F0D58C;color:var(--amb-d);font-size:14px;font-weight:600}

  /* linhas */
  .list{display:flex;flex-direction:column;gap:10px;padding:0 24px 32px}
  .row{display:flex;align-items:center;gap:20px;min-height:90px;padding-right:16px;background:var(--card);border:1px solid var(--ln);border-radius:14px;overflow:hidden}
  .row .bar{width:6px;align-self:stretch;flex-shrink:0}

  .ident{width:150px;flex-shrink:0}
  .pref{font-size:24px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
  .pref small{display:block;font-size:11px;font-weight:700;color:var(--blue-d);letter-spacing:0}
  .esc{font-size:13px;color:var(--mut);margin-top:2px}
  .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:15px;cursor:pointer}
  .info div{display:flex;align-items:center;gap:8px;min-width:0}
  .info span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .info svg{flex-shrink:0}
  .info .loc{font-size:13px;font-weight:600}
  .chg{color:var(--blue-d);font-weight:700}
  .stat{width:210px;flex-shrink:0}
  .pill{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
  .pill i{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .stx{font-size:12px;color:var(--mut);margin-top:5px;padding-left:4px}
  .stx.warn{color:var(--red-d);font-weight:700}
  .acts{display:flex;gap:8px;flex-shrink:0}
  .lib{display:flex;align-items:center;justify-content:center;gap:10px;width:170px;height:60px;border:0;border-radius:12px;background:var(--green);color:#FFFFFF;font-size:19px;font-weight:700}
  .lib:active{transform:scale(.97)}
  .lib.sm{width:150px}
  .out{height:60px;padding:0 18px;border-radius:12px;border:1px solid var(--ln2);background:var(--card);color:var(--tx);font-size:16px;font-weight:700}
  .lib:disabled,.out:disabled{opacity:.5;cursor:default}

  /* cores por situação */
  .k-ready .bar{background:var(--green)} .p-ready{background:var(--green-bg);color:var(--green-d)} .p-ready i{background:var(--green)}
  .k-late .bar{background:var(--red)} .p-late{background:var(--red-bg);color:var(--red-d)} .p-late i{background:var(--red)}
  .k-warn .bar{background:var(--amb)} .p-warn{background:var(--amb-bg);color:var(--amb-d)} .p-warn i{background:var(--amb)}
  .k-pend .bar{background:var(--gray)} .p-pend{background:var(--gray-bg);color:var(--gray-d)} .p-pend i{background:var(--gray)}
  .k-done .bar{background:var(--blue)} .p-done{background:var(--blue-bg);color:var(--blue-d)} .p-done i{background:var(--blue)}
  .k-late{border-color:#F3C9B5}

  .grp{display:flex;align-items:center;gap:10px;width:100%;margin-top:6px;padding:14px 18px;border-radius:14px;border:1px dashed #B8C3CF;background:transparent;color:var(--tx2);font-size:16px;font-weight:800;text-align:left}
  .grp .n{padding:2px 10px;border-radius:999px;background:var(--gray-bg)}
  .grp small{font-weight:600;color:var(--mut);font-size:13px}
  .empty{padding:48px 16px;text-align:center;color:var(--mut);font-size:16px}

  /* modal */
  .ov{position:fixed;inset:0;z-index:20;background:rgba(17,28,44,.45);display:none;align-items:center;justify-content:center;padding:16px}
  .ov.on{display:flex}
  .md{width:min(620px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--card);border-radius:16px;padding:20px;box-shadow:0 20px 50px rgba(17,28,44,.25)}
  .md h2{margin:0 0 2px;font-size:22px;font-weight:800}
  .md .sub{font-size:13px;color:var(--mut)}
  .prevbox{margin:12px 0 14px;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:14px;color:var(--tx2)}
  .prevbox b{color:var(--tx)}
  .fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .fg label,.fg .lb{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;color:var(--tx2)}
  .fg .full{grid-column:1/-1}
  .fg input,.fg select,.fg textarea{height:48px;background:var(--card);border:1px solid var(--ln2);border-radius:10px;padding:0 12px;color:var(--tx);width:100%}
  .fg textarea{height:64px;padding:10px 12px;resize:vertical}
  .req{color:var(--red)}
  .hint{font-size:12px;font-weight:500;color:var(--mut)}
  .combo{position:relative}
  .dd{position:absolute;left:0;right:0;top:100%;margin-top:4px;z-index:3;background:var(--card);border:1px solid var(--ln2);border-radius:12px;display:none;max-height:300px;overflow-y:auto;box-shadow:0 12px 30px rgba(17,28,44,.18)}
  .dd.on{display:block}
  .op{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;border:0;border-bottom:1px solid var(--ln);background:transparent;color:var(--tx);min-height:48px}
  .op:hover,.op:focus{background:var(--bg);outline:none}
  .op .c{font-weight:800;color:var(--navy);min-width:70px}
  .op.novo{color:var(--blue-d);font-weight:700}
  .sel{display:flex;align-items:center;gap:10px;height:48px;padding:0 6px 0 12px;border-radius:10px;border:1px solid var(--green);background:var(--green-bg)}
  .sel .c{font-weight:800;color:var(--green-d)}
  .sel .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
  .sel button{height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--ln2);background:var(--card)}
  .alerta{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--red-bg);color:var(--red-d);font-size:14px;font-weight:600;display:none}
  .mact{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
  .mact .sp{flex:1}
  .btn{min-height:52px;padding:0 18px;border-radius:12px;border:1px solid var(--ln2);background:var(--card);color:var(--tx);font-weight:700;font-size:16px}
  .btn.pri{background:var(--green);border-color:var(--green);color:#FFFFFF}
  .btn.dan{border-color:#F1C7B8;color:var(--red-d)}

  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:30;display:none;align-items:center;gap:14px;background:var(--navy);color:#FFFFFF;padding:10px 10px 10px 18px;border-radius:12px;font-weight:600;box-shadow:0 10px 30px rgba(17,28,44,.3);max-width:94vw}
  .toast.on{display:flex}
  .toast.err{background:var(--red-d)}
  .toast button{height:40px;padding:0 14px;border-radius:8px;border:0;background:#FFFFFF;color:var(--navy);font-weight:800}
  .loading{position:fixed;top:0;left:0;height:3px;background:var(--teal);width:0;z-index:40;transition:width .4s}

  @media (max-width:900px){
    .titulo{display:none}
    .stat{width:auto}
  }
  @media (max-width:760px){
    header{flex-wrap:wrap;gap:8px 12px;padding:10px 14px}
    .hinfo{order:3;width:100%;justify-content:space-between}
    .who{margin-left:auto}
    .tool{padding:12px 14px 10px} .bfil{padding:0 14px}
    .filtros{margin:0 14px 10px} .filtros label,.filtros select,.filtros input{width:100%;min-width:0}
    .tabs{grid-template-columns:repeat(2,minmax(0,1fr));padding:0 14px 10px}
    .resumo,.banner{margin-left:14px;margin-right:14px;padding-left:0;padding-right:0}
    .banner{padding:10px 12px}
    .list{padding:0 14px 32px}
    .row{flex-wrap:wrap;gap:8px 12px;padding:10px 12px 12px 0}
    .row .bar{align-self:stretch;height:auto}
    .bus{width:72px;height:56px}
    .ident{width:auto;flex:1}
    .info{order:4;flex-basis:100%;padding-left:18px}
    .stat{order:3}
    .acts{order:5;flex-basis:100%;padding-left:18px}
    .acts .lib,.acts .out{flex:1;width:auto}
  }
</style>
</head>
<body>
<div class="loading" id="loading"></div>

<header>
  <div class="logo"><b>univale</b><small>TRANSPORTES</small></div>
  <div class="titulo">SOLTURA DE VEÍCULOS</div>
  <div class="hinfo">
    <span id="hGar">Todas as garagens</span><span class="sep">|</span>
    <span id="hData">—</span>
    <span class="hora" id="clock">--:--</span>
    <span class="net" id="net" title="Conexão"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B2A3D" stroke-width="2" stroke-linecap="round" aria-label="Conexão"><path d="M2 8.5a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r="1"/></svg></span>
  </div>
  <button class="who" id="btnWho" type="button">Responsável: —</button>
</header>

<div class="tool">
  <label class="busca">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="fBusca" placeholder="Buscar veículo, linha ou motorista…" aria-label="Buscar">
  </label>
  <button class="bfil" id="btnFil" type="button" aria-expanded="false">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>Filtros
  </button>
</div>
<div class="filtros" id="filtros">
  <label>Garagem deste aparelho <select id="fGar"><option value="">Todas as garagens</option></select></label>
  <label>Data <input type="date" id="fData"></label>
</div>

<nav class="tabs" id="tabs"></nav>
<div class="banner" id="banner" style="display:none"></div>
<div class="resumo" id="resumo"></div>
<div class="list" id="list"></div>

<!-- modal: soltar com alteração / editar realizada -->
<div class="ov" id="ov" role="dialog" aria-modal="true" aria-labelledby="mTit">
  <div class="md">
    <h2 id="mTit">Editar</h2>
    <div class="sub" id="mSub"></div>
    <div class="prevbox" id="mPrev"></div>
    <div class="fg">
      <label>Hora de saída <input type="time" id="mHora" class="mono"></label>
      <label>Carro <input id="mVei" class="mono" list="dlVei" autocomplete="off" placeholder="Ex.: U0540" style="text-transform:uppercase"></label>

      <div class="lb full">Motorista <span class="hint">digite a matrícula ou o nome</span>
        <div class="combo" id="cbMot">
          <input id="mBusca" autocomplete="off" placeholder="Matrícula ou nome">
          <div class="sel" id="mSel" style="display:none"><span class="c" id="mSelC"></span><span class="n" id="mSelN"></span><button type="button" id="mTroca">Trocar</button></div>
          <div class="dd" id="mDD" role="listbox"></div>
        </div>
      </div>
      <div class="full" id="mNovo" style="display:none">
        <div class="fg">
          <label>Matrícula (nova) <input id="mNovoC" class="mono" inputmode="numeric" autocomplete="off"></label>
          <label>Nome do motorista <input id="mNovoN" autocomplete="off" style="text-transform:uppercase"></label>
        </div>
        <div class="hint" style="margin-top:6px">Motorista não encontrado no cadastro — ele será cadastrado ao salvar.</div>
      </div>

      <label class="full" id="lbMotivo"><span>Motivo <span class="req" id="mReq">*</span></span>
        <select id="mMotivo"><option value="">— selecione —</option></select>
      </label>
      <label class="full">Observação <textarea id="mObs" placeholder="Opcional"></textarea></label>
    </div>
    <div class="alerta" id="mAlerta"></div>
    <div class="mact" id="mAct"></div>
  </div>
</div>
<datalist id="dlVei"></datalist>
<div class="toast" id="toast"><span id="toastTx"></span><button type="button" id="toastBtn" style="display:none">Desfazer</button></div>

<script>
/* ===================== configuração ===================== */
// URL da implantação do Apps Script (termina em /exec)
var API_URL = 'https://script.google.com/macros/s/AKfycbzv0y28Rhb-Iy27Y8Z5daelqH8uHbXDGKauEpNUfeuvSoDhQsKI4hmlJeK4eSrKsqh9Pw/exec';

var S = { dia:null, cad:{motivos:[],veiculos:[],motoristas:{}}, offset:0, tab:'pend', atual:null, modo:null, sel:null, novo:false, busy:false };
var LS_RESP='soltura.responsavel', LS_CHAVE='soltura.chave', LS_GAR='soltura.garagem';

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function agora(){ return Date.now()+S.offset; }
function hhmm(ms){ var d=new Date(ms); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k)||''; if(v) localStorage.setItem(k,v); else localStorage.removeItem(k); }catch(e){ S['_'+k]=v; return S['_'+k]||''; } }
function getResp(){ return ls(LS_RESP); }
function titulo(n){ return String(n||'').toLowerCase().replace(/(^|\s)\S/g,function(m){return m.toUpperCase();}).replace(/\s(De|Da|Do|Dos|Das|E)\s/g,function(m){return m.toLowerCase();}); }
function semAcento(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }
function fmtData(iso){ var p=iso.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function semCarro(it){ return !it.veiculo || it.veiculo.toUpperCase()==='FOLGADOR'; }

var _tt;
function toast(msg, err, undo){
  var t=$('toast'); $('toastTx').textContent=msg; t.className='toast on'+(err?' err':'');
  var b=$('toastBtn'); b.style.display=undo?'inline-block':'none'; b.onclick=function(){ t.className='toast'; undo(); };
  clearTimeout(_tt); _tt=setTimeout(function(){ t.className='toast'; }, undo?7000:(err?5000:2600));
}
function loading(on){ var l=$('loading'); l.style.width=on?'70%':'100%'; if(!on) setTimeout(function(){ l.style.width='0'; },300); }

/* ===================== API ===================== */
function api(acao, params, post){
  var chave=ls(LS_CHAVE), req;
  if(post) req=fetch(API_URL,{method:'POST',body:JSON.stringify({acao:acao,chave:chave,dados:params||{}})});
  else {
    var q='acao='+encodeURIComponent(acao)+'&chave='+encodeURIComponent(chave)+'&_='+Date.now();
    Object.keys(params||{}).forEach(function(k){ q+='&'+k+'='+encodeURIComponent(params[k]); });
    req=fetch(API_URL+'?'+q);
  }
  return req.then(function(r){ if(!r.ok) throw new Error('Falha de conexão ('+r.status+')'); return r.json(); },
                  function(){ throw new Error('Sem conexão com o servidor. Verifique a internet.'); })
    .then(function(j){
      if(j.ok) return j.dados;
      if(j.erro==='ACESSO_NEGADO'){ var c=null; try{ c=window.prompt('Este aparelho precisa de chave de acesso:'); }catch(e){} if(c){ ls(LS_CHAVE,c.trim().toUpperCase()); } throw new Error('Aparelho não liberado. Tente de novo.'); }
      throw new Error(j.erro);
    });
}

/* ===================== status ===================== */
function statusPend(it){
  var tol=S.dia.cfg.tolerancia, ant=S.dia.cfg.antecedencia;
  var min=Math.floor((agora()-it.prevMs)/60000);
  if(min>tol) return {k:'crit',txt:'Atrasada +'+min+' min',crit:true};
  if(min>=0) return {k:'tol',txt:'Na tolerância +'+min};
  if(-min<=ant) return {k:'soon',txt:'Sai em '+(-min)+' min'};
  return {k:'prev',txt:'Prevista'};
}
function precisaMotivo(it, r){
  if(!r) return false;
  if(r.status==='NAO_SAIU') return !r.motivo;
  var exige=S.dia.cfg.exigeMotivoTroca;
  var troca=(r.troca_veiculo==='SIM' && !semCarro(it)) || r.troca_motorista==='SIM';
  return !r.motivo && (r.status==='ATRASADA' || (exige && troca));
}

/* ===================== render ===================== */
function getGar(){ return $('fGar').value; }
function telOk(){ var t=S.dia&&S.dia.telemetria; return !!(t&&t.ativa&&!t.erro); }
/* onde o carro está: 'in' (nesta garagem), 'outra', 'fora' (fora das garagens / sem sinal / sem carro), null (sem telemetria) */
function local(it){
  if(!telOk()) return null;
  var G=getGar(), t=it.tel;
  if(semCarro(it)) return {k:'fora',txt:'Sem carro definido'};
  if(!t) return {k:'fora',txt:'Carro não encontrado na telemetria'};
  if(t.semSinal) return {k:'fora',ns:true,txt:'Sem sinal'+(t.quando?' desde '+t.quando:'')+(t.ponto?' · '+t.ponto:'')};
  if(t.garagem && (!G || t.garagem===G)) return {k:'in',txt:'No pátio'+(G?'':' · '+t.garagem)+(t.ignicao==='ON'?' · motor ligado':'')};
  if(t.garagem) return {k:'outra',txt:'Na garagem '+t.garagem};
  return {k:'fora',txt:(t.ponto||'Em rota')+' · '+t.quando+' · '+(t.vel>0?Math.round(t.vel)+' km/h':(t.ignicao==='ON'?'ligado':'desligado'))};
}
function base(){
  var G=getGar(), q=semAcento($('fBusca').value).trim();
  return S.dia.itens.filter(function(it){
    if(G && it.reg && it.reg.garagem && it.reg.garagem!==G && !q) return false;
    if(q){ var r=it.reg||{}; var hay=semAcento([it.escala,it.veiculo,it.cracha,it.motorista,it.linha,r.veiculo_real,r.cracha_real,r.motorista_real].join(' ')); if(hay.indexOf(q)<0) return false; }
    return true;
  });
}

var ICO_USER='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6B7E" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>';
var ICO_CLOCK='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6B7E" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
var ICO_PIN='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>';
var ICO_LOCK='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg>';
var ICO_OK='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>';
var TABS=[['pend','Pendentes'],['verif','Em verificação'],['lib','Liberados'],['todos','Todos']];

function render(){
  if(!S.dia) return;
  var G=getGar(), q=$('fBusca').value.trim(), todos=base();
  var pendAll=todos.filter(function(i){return !i.reg;});
  pendAll.forEach(function(it){ it._st=statusPend(it); it._loc=local(it); });
  var pend=pendAll, sem=[], outra=0;
  if(telOk() && G && !q){
    pend=pendAll.filter(function(i){return i._loc.k==='in';});
    sem=pendAll.filter(function(i){return i._loc.k==='fora';});
    outra=pendAll.filter(function(i){return i._loc.k==='outra';}).length;
  }
  var verif=todos.filter(function(i){return i.reg && i.reg.conferido!=='SIM';});
  var lib=todos.filter(function(i){return i.reg && i.reg.conferido==='SIM';});
  var visPend=pend.concat(sem);
  var tod=todos.filter(function(i){return i.reg || visPend.indexOf(i)>=0;});
  var grupos={pend:pend,verif:verif,lib:lib,todos:tod};
  var n={pend:pend.length+sem.length,verif:verif.length,lib:lib.length,todos:tod.length};

  $('tabs').innerHTML=TABS.map(function(t){ return '<button type="button" class="tab'+(S.tab===t[0]?' on':'')+'" data-tab="'+t[0]+'">'+t[1]+' ('+n[t[0]]+')</button>'; }).join('');

  var atr=pendAll.filter(function(i){return (pend.indexOf(i)>=0||sem.indexOf(i)>=0) && i._st.k==='crit';}).length;
  var semMot=verif.filter(function(i){return precisaMotivo(i,i.reg);}).length;
  var r=[];
  if(S.tab==='pend'){ if(atr) r.push('<b class="c">'+atr+' atrasado'+(atr>1?'s':'')+'</b>'); r.push('<b>'+pend.length+'</b> no pátio para sair'); if(sem.length) r.push(sem.length+' sem garagem'); if(outra) r.push(outra+' na outra garagem'); }
  else if(S.tab==='verif'){ r.push('<b>'+verif.length+'</b> saída'+(verif.length===1?'':'s')+' aguardando conferência'); if(semMot) r.push('<b class="c">'+semMot+' sem motivo</b>'); }
  else if(S.tab==='lib'){ r.push('<b>'+lib.length+'</b> saída'+(lib.length===1?'':'s')+' conferida'+(lib.length===1?'':'s')); }
  else { r.push('<b>'+tod.length+'</b> escalas no dia'); }
  $('resumo').innerHTML=r.join(' · ');

  var itens=grupos[S.tab], h='';
  if(!itens.length && !(S.tab==='pend' && sem.length)){
    h='<div class="empty">'+({pend:'Nenhum carro aguardando soltura agora.',verif:'Nada para conferir agora.',lib:'Nenhuma saída conferida ainda.',todos:'Nenhuma escala encontrada.'})[S.tab]+'</div>';
  }
  itens.forEach(function(it){ h+= it.reg ? linhaReg(it) : linhaPend(it); });
  if(S.tab==='pend' && sem.length){
    var atrS=sem.filter(function(i){return i._st.k==='crit';}).length;
    h+='<button type="button" class="grp" id="btnSem">'+ICO_PIN+'<span>Sem garagem</span><span class="n">'+sem.length+'</span>'+(atrS?'<small style="color:var(--red-d)">'+atrS+' atrasado'+(atrS>1?'s':'')+'</small>':'')+'<span class="grow"></span><small>'+(S.abrirSem?'ocultar':'carro fora do pátio, sem sinal ou sem carro — toque para ver')+'</small></button>';
    if(S.abrirSem) sem.forEach(function(it){ h+=linhaPend(it); });
  }
  $('list').innerHTML=h;
}

function linhaPend(it){
  var st=it._st||statusPend(it), lc=it._loc!==undefined?it._loc:local(it), sc=semCarro(it);
  var k, txt, stx='';
  if(st.k==='crit'){ k='late'; txt='Atrasado '+st.txt.replace(/\D+/g,'')+' min'; }
  else if(lc && lc.k!=='in'){ k='warn'; txt=sc?'Definir carro':(lc.ns?'Sem sinal':'Fora do pátio'); }
  else if(st.k==='tol'){ k='warn'; txt='Na tolerância'; }
  else if(st.k==='soon'){ k='ready'; txt='Pronto para soltura'; stx=st.txt; }
  else { k='pend'; txt='Pendente'; }
  if(st.k==='crit' && lc && lc.k!=='in') stx=sc?'Definir carro':(lc.ns?'Sem sinal da telemetria':'Carro fora do pátio');
  var locHtml=lc?'<div class="loc" style="color:'+(lc.k==='in'?'var(--green-d)':'var(--amb-d)')+'">'+ICO_PIN+'<span>'+esc(lc.txt)+'</span></div>':'';
  return '<div class="row k-'+k+'" id="r-'+it.id+'">'+
    '<div class="bar"></div><div class="bus" role="img" aria-label="Ônibus"></div>'+
    '<div class="ident"><div class="pref">'+(sc?'<span style="color:var(--amb-d)">'+(it.veiculo?esc(it.veiculo):'Sem carro')+'</span>':esc(it.veiculo))+'</div><div class="esc">'+esc(it.escala)+' · '+esc(it.linha)+'</div></div>'+
    '<div class="info" data-act="edit" data-id="'+it.id+'" title="Toque para alterar ou marcar que não saiu">'+
      '<div>'+ICO_USER+'<span>'+(it.motorista?esc(titulo(it.motorista)):'<span style="color:var(--amb-d)">Sem motorista</span>')+'</span></div>'+
      '<div>'+ICO_CLOCK+'<b>'+esc(it.hora_prevista)+'</b></div>'+locHtml+
    '</div>'+
    '<div class="stat"><span class="pill p-'+k+'"><i></i>'+esc(txt)+'</span>'+(stx?'<div class="stx">'+esc(stx)+'</div>':'')+'</div>'+
    '<div class="acts"><button type="button" class="lib" data-act="ok" data-id="'+it.id+'" aria-label="Liberar '+esc(it.veiculo||it.escala)+'">'+ICO_LOCK+'Liberar</button></div>'+
  '</div>';
}

function linhaReg(it){
  var r=it.reg, ns=r.status==='NAO_SAIU', d=Number(r.desvio_min), conf=r.conferido==='SIM';
  var tv=r.troca_veiculo==='SIM', tm=r.troca_motorista==='SIM', falta=precisaMotivo(it,r);
  var k, txt;
  if(ns){ k='late'; txt='Não saiu'; }
  else if(conf){ k='done'; txt='Liberado '+r.hora_real; }
  else if(r.status==='ATRASADA'){ k='late'; txt='Saiu '+r.hora_real+' (+'+d+' min)'; }
  else { k='ready'; txt='Saiu '+r.hora_real; }
  var stx= r._pend?'salvando…' : (conf?'Conferido'+(r.conferido_por?' por '+esc(r.conferido_por):'') : (falta?'Falta informar o motivo':'Aguardando conferência'));
  var trocas=[]; if(tv) trocas.push('carro'); if(tm) trocas.push('motorista');
  return '<div class="row k-'+k+'" id="r-'+it.id+'">'+
    '<div class="bar"></div><div class="bus" role="img" aria-label="Ônibus"></div>'+
    '<div class="ident"><div class="pref'+(tv?' chg':'')+'">'+(ns?esc(it.veiculo||'—'):esc(r.veiculo_real))+(tv?'<small>previsto '+esc(it.veiculo||'—')+'</small>':'')+'</div><div class="esc">'+esc(it.escala)+' · '+esc(it.linha)+'</div></div>'+
    '<div class="info" data-act="editR" data-id="'+it.id+'" title="Toque para editar">'+
      '<div>'+ICO_USER+'<span'+(tm?' class="chg"':'')+'>'+esc(titulo(ns?it.motorista:r.motorista_real))+(tm?' (subst.)':'')+'</span></div>'+
      '<div>'+ICO_CLOCK+'<span>Previsto <b>'+esc(it.hora_prevista)+'</b>'+(ns?'':' · saiu <b>'+esc(r.hora_real)+'</b>')+'</span></div>'+
      (r.motivo?'<div class="loc" style="color:var(--tx2)"><span>Motivo: '+esc(r.motivo)+(r.observacao?' — '+esc(r.observacao):'')+'</span></div>':(trocas.length?'<div class="loc chg"><span>Troca de '+trocas.join(' e ')+'</span></div>':''))+
    '</div>'+
    '<div class="stat"><span class="pill p-'+k+'"><i></i>'+esc(txt)+'</span><div class="stx'+(falta&&!conf?' warn':'')+'">'+stx+'</div></div>'+
    '<div class="acts">'+
      '<button type="button" class="out" data-act="editR" data-id="'+it.id+'"'+(r._pend?' disabled':'')+'>Editar</button>'+
      (conf?'':'<button type="button" class="lib sm" data-act="conf" data-id="'+it.id+'"'+(r._pend?' disabled':'')+'>'+ICO_OK+'Confirmar</button>')+
    '</div>'+
  '</div>';
}

function tick(){
  if(!S.dia) return;
  $('clock').textContent=hhmm(agora());
  $('hData').textContent=fmtData(S.dia.data);
  $('hGar').textContent=getGar()?'Garagem '+getGar():'Todas as garagens';
  var b=$('banner'), msgs=[];
  if(S.dia.data!==S.dia.hoje) msgs.push('Você está vendo '+fmtData(S.dia.data)+', não hoje. Ao liberar, a hora de saída precisa ser informada.');
  if(S.dia.telemetria&&S.dia.telemetria.erro) msgs.push(S.dia.telemetria.erro+' — mostrando todas as escalas.');
  else if(telOk()&&!getGar()) msgs.push('Escolha a garagem deste aparelho em Filtros para ver só os carros do seu pátio.');
  b.style.display=msgs.length?'block':'none'; b.textContent=msgs.join(' ');
  if(!S.atual) render();
}

/* ===================== carregar ===================== */
function carregar(silencioso){
  if(!silencioso) loading(true);
  var t0=Date.now();
  return api('getDia',{data:$('fData').value||''}).then(function(d){
    S.offset=d.agoraMs-Math.round((t0+Date.now())/2);
    // mantém registros otimistas que ainda estão salvando
    if(S.dia) S.dia.itens.forEach(function(o){ if(o.reg&&o.reg._pend){ d.itens.forEach(function(n){ if(n.id===o.id&&!n.reg) n.reg=o.reg; }); } });
    S.dia=d;
    if(!$('fData').value) $('fData').value=d.data;
    var sel=$('fGar'), cur=sel.value||ls(LS_GAR);
    sel.innerHTML='<option value="">Todas as garagens</option>'+(d.garagens||[]).map(function(g){return '<option'+(g===cur?' selected':'')+'>'+esc(g)+'</option>';}).join('');
    $('net').classList.remove('off');
    tick();
  }).catch(function(e){ $('net').classList.add('off'); toast('Erro ao carregar: '+e.message,true); }).then(function(){ loading(false); });
}

/* ===================== ações ===================== */
function item(id){ return S.dia.itens.filter(function(i){return i.id===id;})[0]; }

/* OK da tela Soltura: registra na hora e a escala vai para Realizadas */
function okSoltura(it){
  if(semCarro(it) || !it.cracha || S.dia.data!==S.dia.hoje){ abrir(it,'soltar'); return; }
  var h=hhmm(agora());
  var d=Math.round((agora()-it.prevMs)/60000), tol=S.dia.cfg.tolerancia;
  it.reg={_pend:true,status:d>tol?'ATRASADA':(d<-tol?'ADIANTADA':'NO_HORARIO'),hora_real:h,desvio_min:d,veiculo_real:it.veiculo,cracha_real:it.cracha,motorista_real:it.motorista,troca_veiculo:'',troca_motorista:'',motivo:'',conferido:''};
  render();
  api('registrar',{id:it.id,acao:'SAIU',responsavel:getResp(),garagem:getGar()},true).then(function(reg){
    it.reg=reg; render();
    toast((it.veiculo||it.escala)+' liberado às '+reg.hora_real,false,function(){ voltarSoltura(it); });
  }).catch(function(e){ it.reg=null; render(); toast(it.escala+': '+e.message,true); });
}

/* OK da tela Realizadas: confirma como está (ou abre edição se faltar motivo) */
function okConferir(it){
  var r=it.reg;
  if(precisaMotivo(it,r)){ abrir(it,'editar'); return; }
  var ant=JSON.parse(JSON.stringify(r));
  r.conferido='SIM'; r.conferido_por=getResp(); r._pend=true; render();
  var p={id:it.id,acao:r.status==='NAO_SAIU'?'NAO_SAIU':'SAIU',hora_real:r.hora_real,veiculo:r.veiculo_real,cracha:r.cracha_real,motorista:r.motorista_real,motivo:r.motivo,observacao:r.observacao,responsavel:getResp(),conferir:true,garagem:r.garagem||getGar()};
  api('registrar',p,true).then(function(reg){ it.reg=reg; render(); toast(it.escala+' conferida'); })
    .catch(function(e){ it.reg=ant; render(); toast(e.message,true); });
}

function voltarSoltura(it){
  var ant=it.reg; it.reg=null; render();
  api('desfazer',{id:it.id,responsavel:getResp()},true).then(function(){ toast(it.escala+' voltou para Pendentes'); })
    .catch(function(e){ it.reg=ant; render(); toast(e.message,true); });
}

/* ===================== modal ===================== */
function abrir(it, modo){
  S.atual=it; S.modo=modo; var r=it.reg;
  $('mTit').textContent=(modo==='soltar'?'Liberar ':'Editar saída · ')+it.escala;
  $('mSub').textContent=it.setor+' · '+it.linhas;
  $('mPrev').innerHTML='Previsto: <b class="mono">'+esc(it.hora_prevista)+'</b> · carro <b class="mono">'+esc(it.veiculo||'—')+'</b> · '+(it.motorista?'<b>'+esc(titulo(it.motorista))+'</b> <span class="mono">'+esc(it.cracha)+'</span>':'<b>sem motorista</b>');
  var hoje=S.dia.data===S.dia.hoje;
  $('mHora').value=r&&r.hora_real?r.hora_real:(hoje?hhmm(agora()):'');
  $('mVei').value=r&&r.veiculo_real?r.veiculo_real:(semCarro(it)?'':it.veiculo);
  var c=r&&r.cracha_real?r.cracha_real:it.cracha, n=r&&r.motorista_real?r.motorista_real:it.motorista;
  S.novo=false; $('mNovo').style.display='none';
  if(c) selecionar(c,n); else limparSel();
  $('mMotivo').value=r?r.motivo||'':''; $('mObs').value=r?r.observacao||'':'';
  var bt='';
  if(modo==='soltar') bt='<button class="btn dan" type="button" data-m="nao">Não saiu</button><div class="sp"></div><button class="btn" type="button" data-m="cancel">Cancelar</button><button class="btn pri" type="button" data-m="soltar">Liberar</button>';
  else bt='<button class="btn" type="button" data-m="voltar">Voltar para pendentes</button><div class="sp"></div><button class="btn" type="button" data-m="cancel">Cancelar</button><button class="btn pri" type="button" data-m="salvar">Salvar e confirmar</button>';
  $('mAct').innerHTML=bt;
  validar(); $('ov').classList.add('on');
  setTimeout(function(){ (!$('mVei').value?$('mVei'):(!S.sel?$('mBusca'):null)||{focus:function(){}}).focus(); },60);
}
function fechar(){ $('ov').classList.remove('on'); $('mDD').classList.remove('on'); S.atual=null; S.modo=null; render(); }

/* combo de motorista: matrícula ou nome */
function selecionar(c,n){
  S.sel={c:String(c),n:String(n||'')}; S.novo=false; $('mNovo').style.display='none';
  $('mBusca').style.display='none'; $('mSel').style.display='flex';
  $('mSelC').textContent=c; $('mSelN').textContent=titulo(n)||'(sem nome)';
  $('mDD').classList.remove('on'); validar();
}
function limparSel(){ S.sel=null; $('mSel').style.display='none'; $('mBusca').style.display='block'; $('mBusca').value=''; validar(); }
function buscarMot(){
  var q=$('mBusca').value.trim(), dd=$('mDD');
  if(!q){ dd.classList.remove('on'); return; }
  var dig=/^\d+$/.test(q), qq=semAcento(q), res=[];
  var M=S.cad.motoristas;
  Object.keys(M).forEach(function(c){
    var n=M[c], ok=dig? c.indexOf(q)===0 : semAcento(n).indexOf(qq)>=0 || semAcento(n).split(' ').some(function(p){return p.indexOf(qq)===0;});
    if(ok) res.push([c,n]);
  });
  res.sort(function(a,b){ return a[1].localeCompare(b[1]); });
  var h=res.slice(0,8).map(function(x){ return '<button type="button" class="op" data-c="'+esc(x[0])+'" data-n="'+esc(x[1])+'"><span class="c">'+esc(x[0])+'</span><span>'+esc(titulo(x[1]))+'</span></button>'; }).join('');
  h+='<button type="button" class="op novo" data-novo="1">+ Motorista não está na lista</button>';
  dd.innerHTML=h; dd.classList.add('on');
}
function abrirNovo(){
  var q=$('mBusca').value.trim(); S.novo=true; S.sel=null;
  $('mDD').classList.remove('on'); $('mNovo').style.display='block';
  $('mNovoC').value=/^\d+$/.test(q)?q:''; $('mNovoN').value=/^\d+$/.test(q)?'':q.toUpperCase();
  ($('mNovoC').value?$('mNovoN'):$('mNovoC')).focus(); validar();
}

function motoristaAtual(){
  if(S.novo) return {c:$('mNovoC').value.trim(), n:$('mNovoN').value.trim().toUpperCase()};
  return S.sel?{c:S.sel.c,n:S.sel.n}:{c:'',n:''};
}

function validar(){
  var it=S.atual; if(!it) return {};
  var tol=S.dia.cfg.tolerancia, h=$('mHora').value, v=$('mVei').value.trim().toUpperCase(), m=motoristaAtual();
  var d=null; if(h){ var p=it.hora_prevista.split(':'), q=h.split(':'); d=(+q[0]*60+ +q[1])-(+p[0]*60+ +p[1]); if(d<-720) d+=1440; if(d>720) d-=1440; }
  var trocaV=!semCarro(it) && v && v!==it.veiculo.toUpperCase();
  var trocaM=m.c && m.c!==it.cracha;
  var atrasada=d!==null && d>tol;
  var precisa = S.modo==='editar' && (atrasada || (S.dia.cfg.exigeMotivoTroca && (trocaV||trocaM)));
  $('mReq').style.display=precisa?'inline':'none';
  var w=[]; if(atrasada) w.push('Saída '+d+' min após o previsto.'); if(trocaV) w.push('Carro diferente do escalado.'); if(trocaM) w.push('Motorista diferente do escalado.');
  if(precisa) w.push('Informe o motivo para conferir.');
  $('mAlerta').style.display=w.length?'block':'none'; $('mAlerta').textContent=w.join(' ');
  return {h:h,v:v,m:m,precisa:precisa};
}

function salvar(acao){
  var it=S.atual; if(!it||S.busy) return;
  var x=validar(), mot=$('mMotivo').value;
  if(acao==='SAIU'){
    if(!x.h) return toast('Informe a hora de saída.',true);
    if(!x.v||x.v==='FOLGADOR') return toast('Informe o carro.',true);
    if(!x.m.c) return toast('Escolha o motorista.',true);
    if(S.novo && !x.m.n) return toast('Informe o nome do motorista novo.',true);
    if(x.precisa && !mot){ $('mMotivo').focus(); return toast('Selecione o motivo.',true); }
  } else if(!mot){ $('lbMotivo').scrollIntoView({block:'center'}); $('mMotivo').focus(); return toast('Selecione o motivo de não ter saído.',true); }
  var conferir=S.modo==='editar';
  var p={id:it.id,acao:acao,hora_real:x.h,veiculo:x.v,cracha:x.m.c,motorista:x.m.n,motivo:mot,observacao:$('mObs').value.trim(),responsavel:getResp(),conferir:conferir,garagem:(it.reg&&it.reg.garagem)||getGar()};
  S.busy=true; loading(true);
  api('registrar',p,true).then(function(reg){
    it.reg=reg;
    if(S.novo && x.m.c) S.cad.motoristas[x.m.c]=x.m.n;
    fechar();
    toast(acao==='NAO_SAIU'?it.escala+' marcada como não saiu':(conferir?it.escala+' conferida':it.escala+' solta às '+reg.hora_real));
  }).catch(function(e){ toast(e.message,true); }).then(function(){ S.busy=false; loading(false); });
}

function pedirResp(){
  var v=null; try{ v=window.prompt('Nome do responsável pela soltura neste aparelho:',getResp()); }catch(e){}
  if(v!==null && v.trim()) ls(LS_RESP,v.trim());
  $('btnWho').textContent='Responsável: '+(getResp()||'—');
}

/* ===================== eventos ===================== */
$('list').addEventListener('click',function(e){
  var b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  var it=item(b.getAttribute('data-id')); if(!it) return;
  var a=b.getAttribute('data-act');
  if(a==='ok') okSoltura(it);
  else if(a==='edit') abrir(it,'soltar');
  else if(a==='editR') abrir(it,'editar');
  else if(a==='conf') okConferir(it);
});
$('tabs').addEventListener('click',function(e){ var b=e.target.closest('[data-tab]'); if(b){ S.tab=b.getAttribute('data-tab'); render(); window.scrollTo(0,0); } });
$('fBusca').addEventListener('input',render);
$('btnFil').addEventListener('click',function(){ var f=$('filtros'), on=!f.classList.contains('on'); f.classList.toggle('on',on); this.classList.toggle('on',on); this.setAttribute('aria-expanded',on); });
$('fGar').addEventListener('change',function(){ ls(LS_GAR,this.value); tick(); });
$('list').addEventListener('click',function(e){ if(e.target.closest('#btnSem')){ S.abrirSem=!S.abrirSem; render(); } });
$('fData').addEventListener('change',function(){ carregar(false); });
$('btnWho').addEventListener('click',pedirResp);
$('mAct').addEventListener('click',function(e){
  var b=e.target.closest('[data-m]'); if(!b) return; var m=b.getAttribute('data-m');
  if(m==='cancel') fechar();
  else if(m==='soltar'||m==='salvar') salvar('SAIU');
  else if(m==='nao') salvar('NAO_SAIU');
  else if(m==='voltar'){ var it=S.atual; fechar(); voltarSoltura(it); }
});
$('mBusca').addEventListener('input',buscarMot);
$('mBusca').addEventListener('keydown',function(e){ if(e.key==='Enter'){ var f=$('mDD').querySelector('.op'); if(f){ e.preventDefault(); f.click(); } } });
$('mDD').addEventListener('click',function(e){ var o=e.target.closest('.op'); if(!o) return; if(o.getAttribute('data-novo')) abrirNovo(); else selecionar(o.getAttribute('data-c'),o.getAttribute('data-n')); });
$('mTroca').addEventListener('click',function(){ limparSel(); $('mBusca').focus(); });
['mHora','mVei','mNovoC','mNovoN'].forEach(function(id){ $(id).addEventListener('input',validar); });
$('ov').addEventListener('click',function(e){ if(e.target===this) fechar(); });

/* ===================== início ===================== */
(function init(){
  $('btnWho').textContent='Responsável: '+(getResp()||'—');
  if(API_URL.indexOf('http')!==0){ toast('Configure a API_URL no index.html',true); return; }
  api('getCadastros').then(function(c){
    S.cad=c;
    $('mMotivo').innerHTML='<option value="">— selecione —</option>'+c.motivos.map(function(m){return '<option>'+esc(m)+'</option>';}).join('');
    $('dlVei').innerHTML=c.veiculos.map(function(v){return '<option value="'+esc(v)+'">';}).join('');
  }).catch(function(e){ toast('Erro nos cadastros: '+e.message,true); });
  carregar(false).then(function(){
    if(telOk()&&!getGar()){ $('filtros').classList.add('on'); $('btnFil').classList.add('on'); }
    if(!getResp()) pedirResp();
  });
  setInterval(tick,15000);
  setInterval(function(){ if(!S.atual && !S.busy) carregar(true); },60000);
})();
</script>
</body>
